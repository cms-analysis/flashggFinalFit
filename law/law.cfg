analysis

[logging]

luigi-interface: DEBUG


[luigi_core]

local_scheduler: True
no_lock: True

[job]

job_file_dir: output/htcondor
job_file_dir_mkdtemp: False

htcondor_job_file_dir: output/htcondor
htcondor_job_file_dir_mkdtemp: False


[luigi_worker]

keep_alive: True
ping_interval: 20
wait_interval: 20
max_reschedules: 0
#0

[luigi_scheduler]

retry_count: 0
#0
[core]
task_regex = .*
module = your_module
default-workers = 1
# default-scheduler-host = localhost

[sandbox]
default = local

[target]
default_fs = local

